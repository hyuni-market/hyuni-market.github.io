      <button class="icon-close" type="button" data-close="copy" aria-label="닫기">✕</button>
    </div>
    <div class="copy-body">
      <p class="copy-lead">아래 내용을 길게 눌러 복사한 뒤 1:1 채팅방에 보내 주세요. 성함, 연락처, 주소를 함께 보내주시면 입금 안내 드립니다.</p>
      <textarea class="copy-box" id="copyText" readonly></textarea>
    </div>
  </div>
</div>

<button class="cart-fab" id="cartFab" type="button" hidden>장바구니 <b id="cartFabCount">0</b></button>
<button class="back-fab" id="backFab" type="button" hidden>← 뒤로</button>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="products.js"></script>
<script>
(function () {
  'use strict';

  var DATA = window.HYEONMARKET_DATA;
  var SHOP = DATA.shop;
  var STORAGE_KEY = 'hyeonmarket.cart.v1';

  /* ── 상태 ─────────────────────────────────────────────── */
  var cart = [];                 // [{productId, color, size, qty}]
  var delivery = 'normal';       // 'normal' | 'combined'
  var filter = { q: '', category: 'all', itemType: 'all' };
  var view = 'home';             // 'home' = 브랜드 폴더 | 'brand' = 브랜드 안 상품
  var brandViewId = null;
  var sortMode = 'latest';       // 'latest' | 'name' | 'count'
  var initialFilter = 'all';
  var homeScroll = 0;
  var detailState = null;        // {productId, color, size, qty}
  var PAGE_SIZE = 60;            // 한 번에 보여줄 카드 수(더 보기로 이어서)
  var shown = PAGE_SIZE;
  var chartedBrands = (DATA.brands || []).filter(hasSizeChart);
  var activeBrand = chartedBrands[0] ? chartedBrands[0].id : (DATA.brands[0] ? DATA.brands[0].id : null);
  var lastFocus = null;
  var uiSuppress = false;        // popstate 처리 중에는 history를 다시 쌓지 않아요

  /* ── 유틸 ─────────────────────────────────────────────── */
  function won(n) { return Number(n).toLocaleString('ko-KR') + '원'; }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
    });
  }
  function productById(id) {
    for (var i = 0; i < DATA.products.length; i++) {
      if (DATA.products[i].id === id) return DATA.products[i];
    }
    return null;
  }
  function brandById(id) {
    for (var i = 0; i < DATA.brands.length; i++) {
      if (DATA.brands[i].id === id) return DATA.brands[i];
    }
    return null;
  }
  function brandOf(p) { return brandById(p.brandId) || { name: p.brand, sizeTable: null }; }
  function hasSizeChart(b) { return !!(b && (b.sizeImage || b.sizeTable)); }
  function sizeChartLabel(p) { return '📏 ' + brandOf(p).name + ' 사이즈표'; }
  /* 사이즈별 추가금이 있는 상품은 옵션 가격이 달라져요 */
  function unitPrice(p, size) {
    var add = (p.sizeAdd && size && p.sizeAdd[size]) ? p.sizeAdd[size] : 0;
    return p.price + add;
  }
  function sizeAddHtml(p, s) {
    var add = (p.sizeAdd && p.sizeAdd[s]) ? p.sizeAdd[s] : 0;
    return add ? '<small>+' + Number(add).toLocaleString('ko-KR') + '</small>' : '';
  }
  function optionLabel(color, size) {
    return [color, size].filter(function (x) { return x; }).join(' / ');
  }
  function pad2(n) { return n < 10 ? '0' + n : '' + n; }
  function nowLabel() {
    var d = new Date();
    var days = ['일', '월', '화', '수', '목', '금', '토'];
    return d.getFullYear() + '. ' + (d.getMonth() + 1) + '. ' + d.getDate() + '. (' +
      days[d.getDay()] + ') ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  }

  /* ── 저장 ─────────────────────────────────────────────── */
  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ cart: cart, delivery: delivery }));
    } catch (e) { /* 저장 공간이 없어도 동작에는 문제 없음 */ }
  }
  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      var saved = JSON.parse(raw);
      if (saved && Array.isArray(saved.cart)) {
        cart = saved.cart.filter(function (it) {
          return it && productById(it.productId) && it.qty > 0;
        }).map(function (it) {
          return {
            productId: it.productId,
            color: String(it.color || ''),
            size: String(it.size || ''),
            qty: Math.max(1, Math.min(99, parseInt(it.qty, 10) || 1))
          };
        });
      }
      if (saved && (saved.delivery === 'normal' || saved.delivery === 'combined')) {
        delivery = saved.delivery;
      }
    } catch (e) { cart = []; }
  }

  /* ── 금액 계산 ────────────────────────────────────────── */
  function cartCount() {
    return cart.reduce(function (n, it) { return n + it.qty; }, 0);
  }
  function subtotal() {
    return cart.reduce(function (sum, it) {
      var p = productById(it.productId);
      return sum + (p ? unitPrice(p, it.size) * it.qty : 0);
    }, 0);
  }
  function shippingFee() {
    return delivery === 'combined' ? SHOP.combinedShippingFee : SHOP.shippingFee;
  }
  function shippingLabel() {
    return delivery === 'combined' ? '합배송' : '일반 배송';
  }
  function grandTotal() { return subtotal() + shippingFee(); }

  /* ── 토스트 ───────────────────────────────────────────── */
  var toastTimer = null;
  function toast(msg, ms) {
    var el = document.getElementById('toast');
    var cartOpen = document.getElementById('cartModal').classList.contains('open');
    el.classList.toggle('top', cartOpen);
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, ms || 1900);
  }

  /* ── 모달 ─────────────────────────────────────────────── */
  var MODALS = { detail: 'detailModal', size: 'sizeModal', cart: 'cartModal', copy: 'copyModal' };

  /* 브라우저 히스토리와 화면 상태를 맞춰 두면 아이폰 뒤로가기·엣지 스와이프가 자연스럽게 동작해요 */
  function modalNameOf(id) {
    for (var k in MODALS) { if (MODALS[k] === id) return k; }
    return null;
  }
  function currentUIState() {
    var open = document.querySelector('.modal.open');
    var brandId = (view === 'brand') ? brandViewId : null;
    if (open) {
      var name = modalNameOf(open.id);
      var st = { ui: 'modal', name: name, brandId: brandId };
      if (name === 'detail' && detailState) st.productId = detailState.productId;
      if (name === 'size') st.sizeBrand = activeBrand;
      return st;
    }
    if (brandId) return { ui: 'brand', brandId: brandId };
    return { ui: 'home' };
  }
  function pushUI() {
    if (uiSuppress) return;
    try { history.pushState(currentUIState(), ''); } catch (e) {}
  }

  function openModal(name, opts) {
    var el = document.getElementById(MODALS[name]);
    if (!el) return;
    lastFocus = document.activeElement;
    el.classList.add('open');
    el.setAttribute('aria-hidden', 'false');
    document.body.classList.add('lock');
    if (name === 'cart') {
      // 장바구니를 바로 열면 '담았어요' 안내는 더 필요 없음
      var t = document.getElementById('toast');
      clearTimeout(toastTimer);
      t.classList.remove('show', 'top');
    }
    var focusTarget = el.querySelector('.icon-close');
    if (focusTarget) { try { focusTarget.focus({ preventScroll: true }); } catch (e) { focusTarget.focus(); } }
    if (!opts || !opts.silent) pushUI();
  }
  function closeModal(name, opts) {
    var el = document.getElementById(MODALS[name]);
    if (!el) return;
    if (!opts || !opts.silent) {
      var st = history.state;
      if (st && st.ui === 'modal' && st.name === name) {
        try { history.back(); return; } catch (e) {}
      }
    }
    el.classList.remove('open');
    el.setAttribute('aria-hidden', 'true');
    if (!document.querySelector('.modal.open')) document.body.classList.remove('lock');
    if (lastFocus && typeof lastFocus.focus === 'function') {
      try { lastFocus.focus({ preventScroll: true }); } catch (e) {}
    }
  }

  /* 히스토리 상태 → 화면 복원 (뒤로가기/앞으로가기 공통) */
  function applyUI(st) {
    st = st || { ui: 'home' };
    uiSuppress = true;
    try {
      var open = document.querySelector('.modal.open');
      var openName = open ? modalNameOf(open.id) : null;
      var wantModal = (st.ui === 'modal') ? st.name : null;
      if (open && (!wantModal || wantModal !== openName)) closeModal(openName, { silent: true });
      if (wantModal) {
        if (wantModal === 'detail') {
          if (openName !== 'detail' || !detailState || detailState.productId !== st.productId) {
            openDetail(st.productId, { silent: true });
          }
        } else if (wantModal === 'cart') {
          if (openName !== 'cart') { renderCart(); openModal('cart', { silent: true }); }
        } else if (wantModal === 'size') {
          if (openName !== 'size') openSizeChart(st.sizeBrand, { silent: true });
        } else if (wantModal === 'copy') {
          if (openName !== 'copy') openModal('copy', { silent: true });
        }
      }
      var wantBrand = (st.ui === 'brand' || st.ui === 'modal') ? st.brandId : null;
      if (wantBrand) {
        if (view !== 'brand' || brandViewId !== wantBrand) applyBrandView(wantBrand);
      } else if (view === 'brand') {
        applyHomeView();
      }
    } finally {
      uiSuppress = false;
    }
  }
  window.addEventListener('popstate', function (e) { applyUI(e.state); });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    var open = document.querySelector('.modal.open');
    if (!open) return;
    for (var k in MODALS) { if (MODALS[k] === open.id) closeModal(k); }
  });

  /* ── 목록 (브랜드 폴더 → 브랜드 안 상품) ───────────────── */
  var CHOSUNG = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
  var CHOSUNG_FOLD = { 'ㄲ': 'ㄱ', 'ㄸ': 'ㄷ', 'ㅃ': 'ㅂ', 'ㅆ': 'ㅅ', 'ㅉ': 'ㅈ' };
  function chosung(s) {
    var c = String(s || '').charCodeAt(0);
    if (c < 0xAC00 || c > 0xD7A3) return '';
    var ch = CHOSUNG[Math.floor((c - 0xAC00) / 588)];
    return CHOSUNG_FOLD[ch] || ch;
  }

  function inCategory(p) {
    var cats = p.categories || (p.category ? [p.category] : []);
    return filter.category === 'all' || cats.indexOf(filter.category) !== -1;
  }
  function matchesQuery(p, q) {
    var hay = (p.name + ' ' + p.brand + ' ' + (p.colors || []).join(' ')).toLowerCase();
    return hay.indexOf(q) !== -1;
  }
  /* 품목(아우터·상의·하의…)과 주니어 사이즈 구분 */
  var JUNIOR_SIZE = /^(JS|JM|JL|JXL|JXXL|15|17|19|21|140|145|150|155|160|165)$/i;
  function isJunior(p) {
    var sizes = p.sizes || [];
    for (var i = 0; i < sizes.length; i++) {
      var s = String(sizes[i]).replace(/\s/g, '');
      if (JUNIOR_SIZE.test(s)) return true;
      if (s.indexOf('주니어') !== -1) return true;
    }
    return String(p.name || '').indexOf('주니어') !== -1;
  }
  function inItemType(p) {
    var t = filter.itemType;
    if (!t || t === 'all') return true;
    if (t === 'junior') return isJunior(p);
    return (p.itemType || 'etc') === t;
  }
  function itemTypeName(id) {
    var list = DATA.itemTypes || [];
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i].name;
    return '';
  }
  function scopedProducts() {
    return DATA.products.filter(function (p) {
      if (!inCategory(p)) return false;
      if (view === 'brand' && p.brandId !== brandViewId) return false;
      if (!inItemType(p)) return false;
      return true;
    });
  }

  function renderCategories() {
    var bar = document.getElementById('catBar');
    if (!bar) return;
    var cats = [{ id: 'all', name: '전체' }].concat(DATA.categories || []);
    bar.innerHTML = cats.map(function (c) {
      return '<button class="cat-pill" type="button" data-cat="' + esc(c.id) + '" aria-pressed="' +
        (filter.category === c.id) + '">' + esc(c.name) + '</button>';
    }).join('');
  }

  /* 품목 필터 바 (전체 · 아우터 · 상의 · 하의 · 상하세트 · 원피스 · 실내복 · 주니어) */
  /* 브랜드 바로가기 드롭다운 (전체 브랜드 · 브랜드별 상품 수) */
  function renderBrandSelect() {
    var sel = document.getElementById('brandSelect');
    if (!sel) return;
    var opts = ['<option value="">전체 브랜드</option>'];
    DATA.brands.forEach(function (b) {
      var n = DATA.products.filter(function (p) { return p.brandId === b.id && inCategory(p); }).length;
      if (!n) return;
      opts.push('<option value="' + esc(b.id) + '">' + esc(b.name) + ' (' + n + ')</option>');
    });
    sel.innerHTML = opts.join('');
    sel.value = (view === 'brand' && brandViewId) ? brandViewId : '';
  }

  function renderTypeBar() {
    var bar = document.getElementById('typeBar');
    if (!bar) return;
    var types = DATA.itemTypes || [{ id: 'all', name: '전체' }];
    var base = DATA.products.filter(function (p) {
      if (!inCategory(p)) return false;
      if (view === 'brand' && p.brandId !== brandViewId) return false;
      return true;
    });
    var html = types.map(function (t) {
      var n = base.filter(function (p) {
        return t.id === 'all' ? true : (t.id === 'junior' ? isJunior(p) : (p.itemType || 'etc') === t.id);
      }).length;
      var empty = (view === 'brand' && t.id !== 'all' && !n);
      var label = t.name + (view === 'brand' && t.id !== 'all' && n ? ' ' + n : '');
      return '<button class="type-pill' + (empty ? ' is-empty' : '') + '" type="button" data-type="' + esc(t.id) +
        '" aria-pressed="' + (filter.itemType === t.id) + '">' + esc(label) + '</button>';
    }).join('');
    bar.innerHTML = html;
  }

  function updateChips() {
    var bar = document.getElementById('sortBar');
    if (!bar) return;
    /* 상품 목록(브랜드 안·검색·품목 필터)에서는 정렬 칩을 감춥니다 — 상품은 항상 신상 우선 */
    bar.hidden = (view === 'brand') || !!filter.q.trim() || (filter.itemType !== 'all');
    var chips = bar.querySelectorAll('.chip');
    for (var i = 0; i < chips.length; i++) {
      var c = chips[i];
      var on = c.hasAttribute('data-sort') ? (c.getAttribute('data-sort') === sortMode)
                                           : (c.getAttribute('data-initial') === initialFilter);
      c.setAttribute('aria-pressed', on ? 'true' : 'false');
    }
  }

  function updateInitialAvailability() {
    var avail = {};
    DATA.brands.forEach(function (b) {
      var has = DATA.products.some(function (p) { return p.brandId === b.id && inCategory(p); });
      if (has) avail[chosung(b.name)] = 1;
    });
    var chips = document.querySelectorAll('#sortBar .chip[data-initial]');
    for (var i = 0; i < chips.length; i++) {
      var k = chips[i].getAttribute('data-initial');
      if (k === 'all') continue;
      chips[i].classList.toggle('is-empty', !avail[k]);
    }
  }

  function renderBrandHead() {
    var head = document.getElementById('brandHead');
    if (!head) return;
    if (view !== 'brand') { head.hidden = true; return; }
    var b = brandById(brandViewId);
    if (!b) { head.hidden = true; return; }
    var n = DATA.products.filter(function (p) { return p.brandId === b.id && inCategory(p); }).length;
    head.hidden = false;
    document.getElementById('brandHeadName').textContent = b.name;
    document.getElementById('brandHeadCount').textContent = n + '개 상품';
    document.getElementById('brandHeadActions').innerHTML = hasSizeChart(b)
      ? '<button class="size-link" type="button" data-size-brand="' + esc(b.id) + '">' + esc('📏 ' + b.name + ' 사이즈표') + '</button>'
      : '';
  }

  function brandCollage(items) {
    var thumbs = items.filter(function (p) { return !!p.thumb; }).map(function (p) { return p.thumb; });
    if (!thumbs.length) {
      return '<div class="brand-collage"><div class="ph"></div><div class="ph"></div><div class="ph"></div><div class="ph"></div></div>';
    }
    if (thumbs.length === 1) {
      return '<div class="brand-collage one"><img src="' + esc(thumbs[0]) + '" alt="" loading="lazy" /></div>';
    }
    var cells = [];
    for (var i = 0; i < 4; i++) {
      var src = thumbs[i % thumbs.length];
      cells.push('<img src="' + esc(src) + '" alt="" loading="lazy" />');
    }
    return '<div class="brand-collage">' + cells.join('') + '</div>';
  }

  function renderBrandGrid() {
    var grid = document.getElementById('brandGrid');
    var count = document.getElementById('resultCount');
    var q = filter.q.trim().toLowerCase();
    var scoped = scopedProducts();
    var cards = [];

    DATA.brands.forEach(function (b) {
      var all = scoped.filter(function (p) { return p.brandId === b.id; });
      if (!all.length) return;
      if (initialFilter !== 'all' && chosung(b.name) !== initialFilter) return;
      var items = all;
      if (q) {
        var nameHit = b.name.toLowerCase().indexOf(q) !== -1;
        if (!nameHit) items = all.filter(function (p) { return matchesQuery(p, q); });
      }
      if (!items.length) return;
      cards.push({ brand: b, items: items, total: all.length, newest: brandNewestDate(b.id) });
    });

    if (sortMode === 'count') {
      cards.sort(function (a, b) { return b.total - a.total || a.brand.name.localeCompare(b.brand.name, 'ko'); });
    } else if (sortMode === 'latest') {
      cards.sort(function (a, b) {
        var da = a.newest || '', db = b.newest || '';
        if (da !== db) return db.localeCompare(da);
        return a.brand.name.localeCompare(b.brand.name, 'ko');
      });
    } else {
      cards.sort(function (a, b) { return a.brand.name.localeCompare(b.brand.name, 'ko'); });
    }

    var totalProducts = cards.reduce(function (n, c) { return n + c.total; }, 0);
    count.innerHTML = '브랜드 <b>' + cards.length + '</b>곳 · 상품 <b>' + totalProducts + '</b>개' +
      (q ? ' · “' + esc(filter.q.trim()) + '”' : '');

    if (!cards.length) {
      grid.innerHTML = '<div class="empty-grid"><span class="emoji">🧺</span>조건에 맞는 브랜드가 없어요.<br />다른 검색어로 찾아보세요.</div>';
      return;
    }

    grid.innerHTML = cards.map(function (c) {
      return '' +
        '<div class="brand-card" role="button" tabindex="0" data-brand-open="' + esc(c.brand.id) + '" aria-label="' + esc(c.brand.name) + ' ' + c.total + '개 상품 보기">' +
          brandCollage(sortProducts(c.items)) +
          '<div class="brand-body">' +
            '<span class="brand-name">' + esc(c.brand.name) + '</span>' +
            '<span class="brand-count">' + c.total + '개</span>' +
          '</div>' +
        '</div>';
    }).join('');
  }

  function sortProducts(list) {
    /* 신상이 항상 앞으로: 출시일 최신순 → it_id 큰 순 */
    return list.slice().sort(function (a, b) {
      var da = a.releaseDate || '', db = b.releaseDate || '';
      if (da !== db) return db.localeCompare(da);
      return itNum(b) - itNum(a);
    });
  }
  function itNum(p) {
    return Number(String((p && p.itId) || '').replace(/[^0-9]/g, '') || 0) || 0;
  }
  function brandNewestDate(brandId) {
    var d = '';
    for (var i = 0; i < DATA.products.length; i++) {
      var p = DATA.products[i];
      if (p.brandId !== brandId) continue;
      var rd = p.releaseDate || '';
      if (rd > d) d = rd;
    }
    return d;
  }

  function renderProductGrid() {
    var grid = document.getElementById('productGrid');
    var count = document.getElementById('resultCount');
    var q = filter.q.trim().toLowerCase();
    var list = scopedProducts();
    if (q) list = list.filter(function (p) { return matchesQuery(p, q); });
    if (view !== 'brand' && initialFilter !== 'all') {
      list = list.filter(function (p) { return chosung(p.name) === initialFilter; });
    }
    list = sortProducts(list);

    var typeLabel = (filter.itemType && filter.itemType !== 'all') ? itemTypeName(filter.itemType) : '';
    if (view === 'brand') {
      count.innerHTML = (typeLabel ? esc(typeLabel) + ' <b>' + list.length + '</b>개 상품' : '전체 <b>' + list.length + '</b>개 상품') +
        (q ? ' · “' + esc(filter.q.trim()) + '”' : '');
    } else {
      count.innerHTML = '상품 <b>' + list.length + '</b>개' + (typeLabel ? ' · ' + esc(typeLabel) : '') +
        (q ? ' · “' + esc(filter.q.trim()) + '”' : '');
    }

    if (!list.length) {
      grid.classList.remove('single');
      grid.innerHTML = '<div class="empty-grid"><span class="emoji">🧺</span>조건에 맞는 상품이 없어요.<br />다른 검색어로 찾아보세요.</div>';
      var m0 = document.getElementById('loadMoreWrap');
      if (m0) m0.innerHTML = '';
      return;
    }
    grid.classList.toggle('single', list.length === 1);
    document.querySelector('.result-line').classList.toggle('single', list.length === 1);

    var visible = list.slice(0, shown);
    grid.innerHTML = visible.map(function (p) {
      var brand = brandOf(p);
      var media = p.thumb
        ? '<img src="' + esc(p.thumb) + '" alt="' + esc(p.brand + ' ' + p.name) + '" loading="lazy" />'
        : '<div class="card-ph"><span>' + esc(p.brand) + '</span></div>';
      var meta = [];
      if (p.colors.length) meta.push(esc(p.colors.join(' · ')));
      if (p.sizes.length) meta.push(esc(p.sizes.join(' · ')));
      return '' +
        '<div class="card" role="button" tabindex="0" data-open-detail="' + esc(p.id) + '" aria-label="' + esc(p.brand + ' ' + p.name) + ' 상세 보기">' +
          '<div class="card-media">' +
            (p.badge ? '<span class="badge">' + esc(p.badge) + '</span>' : '') +
            media +
          '</div>' +
          '<div class="card-body">' +
            '<span class="card-brand">' + esc(p.brand) + '</span>' +
            '<span class="card-name">' + esc(p.name) + '</span>' +
            '<span class="card-price">' + won(p.price) + '</span>' +
            '<span class="card-meta">' + meta.join('<br />') + '</span>' +
          '</div>' +
        '</div>';
    }).join('');

    var more = document.getElementById('loadMoreWrap');
    if (more) {
      more.innerHTML = list.length > shown
        ? '<button class="load-more" type="button" id="loadMoreBtn">상품 더 보기 (' + (list.length - shown) + '개 남았어요)</button>'
        : '';
    }
  }

  function renderAll() {
    var q = filter.q.trim();
    var typeOn = !!(filter.itemType && filter.itemType !== 'all');
    var productsMode = (view === 'brand') || !!q || typeOn;
    var hero = document.querySelector('.hero');
    if (hero) hero.hidden = (view === 'brand');
    var catBar = document.getElementById('catBar');
    if (catBar) catBar.hidden = (view === 'brand');

    document.getElementById('brandGrid').hidden = productsMode;
    document.getElementById('productGrid').hidden = !productsMode;
    updateInitialAvailability();
    var resLine = document.querySelector('.result-line');
    if (resLine) resLine.hidden = (view === 'brand');
    renderBrandHead();
    renderTypeBar();
    renderBrandSelect();
    updateChips();
    updateBackFab();

    if (productsMode) renderProductGrid();
    else renderBrandGrid();
  }

  function updateBackFab() {
    var fab = document.getElementById('backFab');
    if (!fab) return;
    fab.hidden = (view !== 'brand');
  }

  function applyBrandView(brandId) {
    view = 'brand';
    brandViewId = brandId;
    filter.q = '';
    var input = document.getElementById('searchInput');
    if (input) input.value = '';
    initialFilter = 'all';
    filter.itemType = 'all';
    resetPaging();
    renderAll();
    window.scrollTo(0, 0);
  }

  function applyHomeView() {
    view = 'home';
    brandViewId = null;
    resetPaging();
    renderAll();
    window.scrollTo(0, homeScroll || 0);
  }

  function openBrand(brandId) {
    if (!brandById(brandId)) return;
    if (view === 'brand' && brandViewId === brandId) return;
    homeScroll = window.pageYOffset || document.documentElement.scrollTop || 0;
    applyBrandView(brandId);
    pushUI();
  }

  function backToBrands() {
    var st = history.state;
    if (st && (st.ui === 'brand' || st.ui === 'modal')) {
      try { history.back(); return; } catch (e) {}
    }
    applyHomeView();
  }

  function resetPaging() { shown = PAGE_SIZE; }

  /* ── 상품 상세 ────────────────────────────────────────── */
  function openDetail(productId, opts) {
    var p = productById(productId);
    if (!p) return;
    detailState = {
      productId: p.id,
      color: (p.colors && p.colors.length === 1) ? p.colors[0] : '',
      size: null,
      qty: 1,
      picks: []            // [{color, size, qty}] — 형제 옵션을 여러 개 담을 수 있어요
    };
    renderDetail();
    openModal('detail', opts);
    var sc = document.getElementById('detailScroll');
    if (sc) sc.scrollTop = 0;
  }

  /* 색상 + 사이즈가 모두 골라지면 '선택한 옵션'에 한 줄 추가하고 선택은 비워요 */
  function autoPick() {
    var st = detailState;
    if (!st) return;
    var p = productById(st.productId);
    if (!p) return;
    var hasColors = !!(p.colors && p.colors.length);
    if (hasColors && !st.color) return;
    if (p.sizes.length && !st.size) return;
    var color = hasColors ? st.color : '';
    var size = st.size || '';
    var found = null;
    for (var i = 0; i < st.picks.length; i++) {
      if (st.picks[i].color === color && st.picks[i].size === size) { found = st.picks[i]; break; }
    }
    if (found) found.qty = Math.min(99, found.qty + 1);
    else st.picks.push({ color: color, size: size, qty: 1 });
    st.color = (hasColors && p.colors.length === 1) ? p.colors[0] : '';
    st.size = null;
  }

  function picksTotal(p) {
    var st = detailState;
    if (!st) return 0;
    return (st.picks || []).reduce(function (n, pk) { return n + unitPrice(p, pk.size) * pk.qty; }, 0);
  }

  function renderDetail() {
    var st = detailState;
    if (!st) return;
    var p = productById(st.productId);
    var brand = brandOf(p);
    var wrap = document.getElementById('detailScroll');
    var picks = st.picks || [];
    var picksSum = picksTotal(p);
    var picking = (p.colors.length ? !!st.color : true) && (p.sizes.length ? !!st.size : true);
    var totalNow = picksSum + (picking ? unitPrice(p, st.size) : 0);

    var colors = p.colors.map(function (c) {
      var hex = (p.colorHex && p.colorHex[c]) || '#ddd';
      return '<button class="swatch" type="button" data-color="' + esc(c) + '" aria-pressed="' + (st.color === c) + '">' +
        '<span class="dot" style="background:' + esc(hex) + '"></span>' + esc(c) + '</button>';
    }).join('');

    var sizes = p.sizes.map(function (s) {
      var hint = (p.sizeHints && p.sizeHints[s]) ? '<small>' + esc(p.sizeHints[s]) + '</small>' : '';
      return '<button class="size-btn" type="button" data-size="' + esc(s) + '" aria-pressed="' + (st.size === s) + '">' +
        esc(s) + hint + sizeAddHtml(p, s) + '</button>';
    }).join('');

    var gallery = p.detailImages && p.detailImages.length
      ? '<p class="gallery-head">상세 이미지 ' + p.detailImages.length + '장</p>' +
        p.detailImages.map(function (src, i) {
          return '<img src="' + esc(src) + '" alt="' + esc(p.name) + ' 상세 이미지 ' + (i + 1) + '" loading="lazy" />';
        }).join('')
      : '';
    var mainSrc = p.image || p.thumb;
    var mainMedia = mainSrc
      ? '<img class="detail-main' + ((p.detailImages && p.detailImages.length) ? '' : ' fit') + '" src="' + esc(mainSrc) + '" alt="' + esc(p.brand + ' ' + p.name) + '" />'
      : '<div class="detail-main-ph"><span>' + esc(p.brand) + '</span></div>';
    var colorBlock = p.colors.length
      ? '<div class="opt-block">' +
          '<div class="opt-head">' +
            '<span class="opt-label">색상<span>' + esc(st.color || '선택') + '</span></span>' +
          '</div>' +
          '<div class="swatches">' + colors + '</div>' +
        '</div>'
      : '';
    var sizeBlock = p.sizes.length
      ? '<div class="opt-block">' +
          '<div class="opt-head">' +
            '<span class="opt-label">사이즈' + (st.size ? '<span>' + esc(st.size) + '</span>' : '<span>필수</span>') + '</span>' +
            (hasSizeChart(brand) ? '<button class="size-link" type="button" data-size-brand="' + esc(p.brandId) + '">' + esc(sizeChartLabel(p)) + '</button>' : '') +
          '</div>' +
          '<div class="sizes">' + sizes + '</div>' +
        '</div>'
      : '<div class="opt-block"><div class="opt-head"><span class="opt-label">사이즈<span>단일 사이즈</span></span>' +
        (hasSizeChart(brand) ? '<button class="size-link" type="button" data-size-brand="' + esc(p.brandId) + '">' + esc(sizeChartLabel(p)) + '</button>' : '') +
        '</div></div>';

    var picksHtml = picks.length
      ? '<div class="picks" id="detailPicks">' +
          '<p class="picks-head"><span>선택한 옵션</span><span>' + picks.length + '개</span></p>' +
          picks.map(function (pk, i) {
            return '<div class="pick-row" data-pick-row="' + i + '">' +
              '<span class="pick-label">' + esc(optionLabel(pk.color, pk.size)) + '</span>' +
              '<div class="stepper" role="group" aria-label="수량">' +
                '<button type="button" data-pick-qty="-1" data-pick="' + i + '" aria-label="수량 줄이기"' + (pk.qty <= 1 ? ' disabled' : '') + '>−</button>' +
                '<span class="qty">' + pk.qty + '</span>' +
                '<button type="button" data-pick-qty="1" data-pick="' + i + '" aria-label="수량 늘리기">+</button>' +
              '</div>' +
              '<span class="pick-price">' + won(unitPrice(p, pk.size) * pk.qty) + '</span>' +
              '<button class="pick-del" type="button" data-pick-del="' + i + '" aria-label="옵션 삭제">×</button>' +
            '</div>';
          }).join('') +
        '</div>'
      : '';

    wrap.innerHTML = '' +
      '<div class="detail-body">' +
        '<div class="detail-media">' + mainMedia + '</div>' +
        '<div class="detail-info' + (inlineSizeChartHtml(brand) ? ' has-size-chart' : '') + '">' +
          '<span class="d-brand">' + esc(brand.name) + '</span>' +
          '<h3 class="d-name">' + esc(p.name) + '</h3>' +
          '<div class="d-price" id="detailPrice">' + won(p.price) + '</div>' +
          '<ul class="d-desc">' + p.description.map(function (d) { return '<li>' + esc(d) + '</li>'; }).join('') + '</ul>' +

          colorBlock +
          sizeBlock +

          picksHtml +

          '<div class="qty-row">' +
            '<span class="opt-label">합계</span>' +
            '<span class="line-total" id="detailTotal">' + won(totalNow) + '</span>' +
          '</div>' +

          '<button class="btn btn-primary add-btn" type="button" id="addToCartBtn">' +
            (totalNow ? '총 ' + won(totalNow) + ' · 장바구니 담기' : '장바구니 담기') + '</button>' +
          '<p class="add-note">배송비 3,500원 · 합배송 선택 시 0원</p>' +

          /* 브랜드 사이즈표를 여기서 바로 보여줘요 (버튼을 또 누를 필요 없이) */
          inlineSizeChartHtml(brand) +
        '</div>' +
        (gallery ? '<div class="detail-gallery">' + gallery + '</div>' : '') +
      '</div>';
  }

  function updateDetailTotals() {
    if (!detailState) return;
    var p = productById(detailState.productId);
    if (!p) return;
    var t = document.getElementById('detailTotal');
    if (t) t.textContent = won(picksTotal(p));
  }

  document.getElementById('detailScroll').addEventListener('click', function (e) {
    var t = e.target;
    var colorBtn = t.closest('[data-color]');
    var sizeBtn = t.closest('[data-size]:not(.size-link)');
    var pickQty = t.closest('[data-pick-qty]');
    var pickDel = t.closest('[data-pick-del]');
    var addBtn = t.closest('#addToCartBtn');
    if (!detailState) return;
    var p = productById(detailState.productId);
    if (!p) return;

    if (pickQty) {
      var pi = parseInt(pickQty.getAttribute('data-pick'), 10);
      var pd = parseInt(pickQty.getAttribute('data-pick-qty'), 10);
      var pk = detailState.picks[pi];
      if (pk) {
        pk.qty = Math.max(1, Math.min(99, pk.qty + pd));
        renderDetail();
      }
      return;
    }
    if (pickDel) {
      detailState.picks.splice(parseInt(pickDel.getAttribute('data-pick-del'), 10), 1);
      renderDetail();
      return;
    }
    if (colorBtn) {
      var c = colorBtn.getAttribute('data-color');
      detailState.color = (detailState.color === c) ? '' : c;   // 한 번 더 누르면 선택 해제
      autoPick();
      renderDetail();
      return;
    }
    if (sizeBtn) {
      var s = sizeBtn.getAttribute('data-size');
      detailState.size = (detailState.size === s) ? null : s;   // 한 번 더 누르면 선택 해제
      autoPick();
      renderDetail();
      return;
    }
    if (addBtn) {
      var picks = (detailState.picks || []).slice();
      if (!picks.length) {
        if (p.sizes.length && !detailState.size) {
          toast(p.colors.length && !detailState.color ? '색상과 사이즈를 선택해 주세요' : '사이즈를 선택해 주세요');
          return;
        }
        picks = [{ color: detailState.color || '', size: detailState.size || '', qty: 1 }];
      }
      picks.forEach(function (pk) { addToCart(p.id, pk.color, pk.size, pk.qty); });
      closeModal('detail');
      toast('장바구니에 담았어요 · 총 ' + cartCount() + '개');
      return;
    }
  });

  /* ── 장바구니 ─────────────────────────────────────────── */
  function addToCart(productId, color, size, qty) {
    var found = null;
    for (var i = 0; i < cart.length; i++) {
      if (cart[i].productId === productId && cart[i].color === color && cart[i].size === size) { found = cart[i]; break; }
    }
    if (found) {
      found.qty = Math.min(99, found.qty + qty);
    } else {
      cart.push({ productId: productId, color: color, size: size, qty: Math.min(99, qty) });
    }
    save();
    renderCart();
    renderBadge();
  }

  function setQty(index, delta) {
    var it = cart[index];
    if (!it) return;
    it.qty = Math.max(1, Math.min(99, it.qty + delta));
    save();
    renderCart();
    renderBadge();
  }

  function removeItem(index) {
    cart.splice(index, 1);
    save();
    renderCart();
    renderBadge();
    toast('장바구니에서 삭제했어요');
  }

  function renderBadge() {
    var n = cartCount();
    var badge = document.getElementById('cartCount');
    var head = document.getElementById('cartHeadCount');
    badge.textContent = n;
    badge.setAttribute('data-empty', n === 0 ? 'true' : 'false');
    if (head) head.textContent = n;
    var fab = document.getElementById('cartFab');
    var fabN = document.getElementById('cartFabCount');
    if (fab) fab.hidden = n === 0;
    if (fabN) fabN.textContent = n;
    document.body.classList.toggle('has-cart', n > 0);
  }

  function renderCart() {
    var body = document.getElementById('cartBody');
    var foot = document.getElementById('cartFoot');

    if (!cart.length) {
      body.innerHTML = '<div class="cart-empty"><span class="emoji">🧺</span><p>장바구니가 비어 있어요</p>' +
        '<button class="btn btn-soft" type="button" data-close="cart">쇼핑 계속하기</button></div>';
      foot.innerHTML = '';
      return;
    }

    body.innerHTML = cart.map(function (it, i) {
      var p = productById(it.productId);
      return '' +
        '<div class="cart-item" data-index="' + i + '">' +
          '<img class="cart-item-img cart-item-clickable" src="' + esc(p.thumb) + '" alt="" />' +
          '<div class="cart-item-main">' +
            '<span class="cart-item-brand cart-item-clickable">' + esc(p.brand) + '</span>' +
            '<span class="cart-item-name cart-item-clickable">' + esc(p.name) + '</span>' +
            '<span class="cart-item-opt cart-item-clickable">' + esc(optionLabel(it.color, it.size)) + '</span>' +
            '<div class="cart-item-bottom">' +
              '<div class="stepper" role="group" aria-label="수량">' +
                '<button type="button" data-cart-qty="-1" aria-label="수량 줄이기"' + (it.qty <= 1 ? ' disabled' : '') + '>−</button>' +
                '<span class="qty">' + it.qty + '</span>' +
                '<button type="button" data-cart-qty="1" aria-label="수량 늘리기">+</button>' +
              '</div>' +
              '<span class="cart-item-price">' + won(unitPrice(p, it.size) * it.qty) + '</span>' +
            '</div>' +
            '<button class="cart-item-del" type="button" data-cart-del="' + i + '">삭제</button>' +
          '</div>' +
        '</div>';
    }).join('');

    foot.innerHTML = '' +
      '<div class="delivery-block">' +
        '<p class="delivery-title">배송 방법</p>' +
        '<label class="radio">' +
          '<input type="radio" name="delivery" value="normal"' + (delivery === 'normal' ? ' checked' : '') + ' />' +
          '<span>일반 배송</span><span class="price">' + won(SHOP.shippingFee) + '</span>' +
        '</label>' +
        '<label class="radio">' +
          '<input type="radio" name="delivery" value="combined"' + (delivery === 'combined' ? ' checked' : '') + ' />' +
          '<span>합배송</span><span class="price">' + won(SHOP.combinedShippingFee) + '</span>' +
        '</label>' +
        '<p class="delivery-hint">합배송은 다른 주문과 함께 받으실 때 선택해 주세요. 배송비가 0원이에요.</p>' +
      '</div>' +
      '<div class="summary">' +
        '<div class="sum-row"><span>상품 합계</span><span>' + won(subtotal()) + '</span></div>' +
        '<div class="sum-row"><span>배송비 (' + shippingLabel() + ')</span><span>' + won(shippingFee()) + '</span></div>' +
        '<div class="sum-row total"><span>총 결제금액</span><b id="cartTotal">' + won(grandTotal()) + '</b></div>' +
      '</div>' +
      '<div class="cart-actions">' +
        '<button class="btn btn-primary" type="button" id="copyOrderBtn">주문서 복사하기</button>' +
        '<button class="btn btn-ghost" type="button" data-close="cart">계속 쇼핑</button>' +
      '</div>' +
      '<p class="copy-hint">1:1 채팅방에 복사한 주문서와 함께 성함, 연락처, 주소를 보내주시면 입금 안내 드립니다.</p>';
  }

  document.getElementById('cartBody').addEventListener('click', function (e) {
    var qbtn = e.target.closest('[data-cart-qty]');
    var dbtn = e.target.closest('[data-cart-del]');
    if (qbtn) {
      var row = qbtn.closest('.cart-item');
      setQty(parseInt(row.getAttribute('data-index'), 10), parseInt(qbtn.getAttribute('data-cart-qty'), 10));
      return;
    }
    if (dbtn) {
      removeItem(parseInt(dbtn.getAttribute('data-cart-del'), 10));
      return;
    }
    /* 상품 사진·이름을 누르면 상세로 이동 */
    var itemRow = e.target.closest('.cart-item');
    if (!itemRow) return;
    var it = cart[parseInt(itemRow.getAttribute('data-index'), 10)];
    if (!it) return;
    openDetailFromCart(it.productId);
  });

  function openDetailFromCart(productId) {
    if (!productById(productId)) return;
    closeModal('cart', { silent: true });
    try {
      history.replaceState({ ui: 'modal', name: 'detail', productId: productId, brandId: (view === 'brand' ? brandViewId : null) }, '');
    } catch (e) {}
    openDetail(productId, { silent: true });
  }

  document.getElementById('cartFoot').addEventListener('change', function (e) {
    if (!e.target || e.target.name !== 'delivery') return;
    delivery = e.target.value === 'combined' ? 'combined' : 'normal';
    save();
    renderCart();
  });

  document.getElementById('cartFoot').addEventListener('click', function (e) {
    if (e.target.closest('#copyOrderBtn')) copyOrder();
  });

  /* ── 주문서 ───────────────────────────────────────────── */
  function buildOrderText() {
    var lines = [];
    lines.push('🛍️ ' + SHOP.name + ' 주문서');
    lines.push(nowLabel());
    lines.push('');
    cart.forEach(function (it, i) {
      var p = productById(it.productId);
      lines.push((i + 1) + ') ' + p.brand + ' ' + p.name);
      lines.push('   ' + optionLabel(it.color, it.size) + ' / ' + it.qty + '개 · ' + won(unitPrice(p, it.size) * it.qty));
    });
    lines.push('');
    lines.push('상품 합계 ' + won(subtotal()));
    lines.push('배송 ' + shippingLabel() + ' (' + won(shippingFee()) + ')');
    lines.push('총 결제금액 ' + won(grandTotal()));
    lines.push('');
    lines.push('성함: ');
    lines.push('연락처: ');
    lines.push('주소: ');
    return lines.join('\n');
  }

  function copyText(text) {
    return new Promise(function (resolve) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { resolve(true); }, function () { resolve(fallbackCopy(text)); });
      } else {
        resolve(fallbackCopy(text));
      }
    });
  }

  function fallbackCopy(text) {
    try {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.top = '-1000px';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, text.length);
      var ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return ok;
    } catch (e) {
      return false;
    }
  }

  function copyOrder() {
    if (!cart.length) {
      toast('장바구니가 비어 있어요');
      return;
    }
    var text = buildOrderText();
    copyText(text).then(function (ok) {
      if (ok) {
        toast('주문서가 복사됐어요! 1:1 채팅방에 성함, 연락처, 주소와 함께 보내주시면 입금 안내 드립니다.', 4200);
      } else {
        var box = document.getElementById('copyText');
        box.value = text;
        openModal('copy');
        setTimeout(function () { try { box.select(); } catch (e) {} }, 260);
      }
    });
  }

  /* ── 사이즈표 ─────────────────────────────────────────── */
  function sizeTableHtml(b) {
    if (!b || !b.sizeTable) return '';
    return '<div class="table-wrap"><table class="size-table"><thead><tr>' +
      b.sizeTable.columns.map(function (c) { return '<th scope="col">' + esc(c) + '</th>'; }).join('') +
      '</tr></thead><tbody>' +
      b.sizeTable.rows.map(function (r) {
        return '<tr>' + r.map(function (cell, i) {
          return i === 0 ? '<th scope="row" style="font-weight:800;color:#2f2620;background:#fff">' + esc(cell) + '</th>' : '<td>' + esc(cell) + '</td>';
        }).join('') + '</tr>';
      }).join('') +
      '</tbody></table></div>';
  }

  /* 사이즈표 본문: 브랜드가 원본 이미지를 주면 이미지만, 없으면 표로 */
  function sizeChartBodyHtml(b, figureClass) {
    if (b && b.sizeImage) {
      return '<figure class="' + figureClass + '">' +
        '<img src="' + esc(b.sizeImage) + '" alt="' + esc(b.name) + ' 사이즈표 이미지" /></figure>';
    }
    return sizeTableHtml(b);
  }

  /* 상품 상세 안에 바로 붙는 브랜드 사이즈표 */
  function inlineSizeChartHtml(b) {
    if (!b || (!b.sizeTable && !b.sizeImage)) return '';
    var html = '<section class="detail-size" id="detailSizeChart" aria-labelledby="detailSizeTitle">' +
      '<div class="detail-size-head">' +
        '<h4 id="detailSizeTitle">📏 ' + esc(b.name) + ' 사이즈표</h4>' +
        (b.nameEn ? '<span>' + esc(b.nameEn) + '</span>' : '') +
      '</div>' +
      sizeChartBodyHtml(b, 'detail-size-figure');
    if (b.sizeNote) html += '<p class="size-note">' + esc(b.sizeNote) + '</p>';
    return html + '</section>';
  }

  function renderSizePills() {
    var pills = document.getElementById('sizeBrandPills');
    pills.innerHTML = chartedBrands.map(function (b) {
      return '<button class="brand-pill" type="button" role="tab" data-brand-tab="' + esc(b.id) + '" aria-pressed="' + (activeBrand === b.id) + '">' + esc(b.name) + '</button>';
    }).join('');
    var on = pills.querySelector('[aria-pressed="true"]');
    if (on && on.scrollIntoView) on.scrollIntoView({ block: 'nearest' });
  }

  function renderSizeBody() {
    var b = brandById(activeBrand) || chartedBrands[0];
    if (!b) {
      document.getElementById('sizeBody').innerHTML = '<p class="size-note">사이즈표를 불러오지 못했어요.</p>';
      return;
    }
    activeBrand = b.id;
    var html = '<div class="size-brand-head"><h3>' + esc(b.name) + ' 사이즈</h3><span>' + esc(b.nameEn || '') + '</span></div>';

    if (hasSizeChart(b)) {
      html += sizeChartBodyHtml(b, 'size-figure');
      if (b.sizeNote) html += '<p class="size-note">' + esc(b.sizeNote) + '</p>';
    } else {
      html += '<p class="size-note">이 브랜드는 아직 사이즈표 이미지가 없어요. 상품마다 사이즈 옵션을 확인해 주세요.</p>';
    }
    document.getElementById('sizeBody').innerHTML = html;
    renderSizePills();
  }

  function openSizeChart(brandId, opts) {
    if (brandId && hasSizeChart(brandById(brandId))) activeBrand = brandId;
    renderSizeBody();
    openModal('size', opts);
    var sc = document.getElementById('sizeBody');
    if (sc) sc.scrollTop = 0;
  }

  document.getElementById('sizeBrandPills').addEventListener('click', function (e) {
    var btn = e.target.closest('[data-brand-tab]');
    if (!btn) return;
    activeBrand = btn.getAttribute('data-brand-tab');
    renderSizeBody();
  });

  /* ── 전역 클릭 위임 ───────────────────────────────────── */
  document.addEventListener('click', function (e) {
    var closer = e.target.closest('[data-close]');
    if (closer) {
      closeModal(closer.getAttribute('data-close'));
      return;
    }
    var sizeLink = e.target.closest('[data-size-brand]');
    if (sizeLink) {
      e.preventDefault();
      e.stopPropagation();
      openSizeChart(sizeLink.getAttribute('data-size-brand'));
      return;
    }
    var card = e.target.closest('[data-open-detail]');
    if (card) {
      openDetail(card.getAttribute('data-open-detail'));
      return;
    }
  });

  // 카드(role=button)는 키보드(Enter/Space)로도 열리게
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    var card = e.target.closest && e.target.closest('[data-open-detail]');
    if (!card || e.target !== card) return;
    e.preventDefault();
    openDetail(card.getAttribute('data-open-detail'));
  });

  /* ── 상단 버튼 / 검색 ─────────────────────────────────── */
  /* 브랜드 안에서는 그 브랜드 사이즈표를 바로, 홈에서는 최근에 보던 브랜드 사이즈표를 연다 */
  function sizeChartTargetBrand() { return (view === 'brand' && brandViewId) ? brandViewId : activeBrand; }
  document.getElementById('topSizeBtn').addEventListener('click', function () { openSizeChart(sizeChartTargetBrand()); });
  var gridSizeBtn = document.getElementById('gridSizeBtn');
  if (gridSizeBtn) gridSizeBtn.addEventListener('click', function () { openSizeChart(sizeChartTargetBrand()); });
  document.getElementById('openCartBtn').addEventListener('click', function () {
    renderCart();
    openModal('cart');
  });

  var searchInput = document.getElementById('searchInput');
  var searchTimer = null;
  searchInput.addEventListener('input', function () {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function () {
      filter.q = searchInput.value;
      resetPaging();
      renderAll();
    }, 120);
  });

  document.getElementById('catBar').addEventListener('click', function (e) {
    var btn = e.target.closest('[data-cat]');
    if (!btn) return;
    filter.category = btn.getAttribute('data-cat');
    filter.itemType = 'all';
    resetPaging();
    renderCategories();
    renderAll();
  });

  /* 품목 필터 (아우터 · 상의 · 하의 · 상하세트 · 원피스 · 실내복 · 주니어) */
  document.getElementById('typeBar').addEventListener('click', function (e) {
    var btn = e.target.closest('[data-type]');
    if (!btn) return;
    var next = btn.getAttribute('data-type');
    filter.itemType = (filter.itemType === next) ? 'all' : next;
    resetPaging();
    renderAll();
  });

  document.getElementById('loadMoreWrap').addEventListener('click', function (e) {
    if (!e.target.closest('#loadMoreBtn')) return;
    shown += PAGE_SIZE;
    renderProductGrid();
  });

  /* 브랜드 드롭다운: 바로 그 브랜드로 이동 / 전체 브랜드면 폴더 그리드로 */
  document.getElementById('brandSelect').addEventListener('change', function (e) {
    var id = e.target.value;
    if (!id) {
      if (view === 'brand') backToBrands();
      else { renderAll(); }
      return;
    }
    if (view === 'brand' && brandViewId === id) return;
    openBrand(id);
  });

  document.getElementById('sortBar').addEventListener('click', function (e) {
    var chip = e.target.closest('.chip');
    if (!chip) return;
    if (chip.hasAttribute('data-sort')) sortMode = chip.getAttribute('data-sort');
    else initialFilter = chip.getAttribute('data-initial');
    resetPaging();
    renderAll();
  });

  document.getElementById('brandGrid').addEventListener('click', function (e) {
    var card = e.target.closest('[data-brand-open]');
    if (card) openBrand(card.getAttribute('data-brand-open'));
  });
  document.getElementById('brandGrid').addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    var card = e.target.closest && e.target.closest('[data-brand-open]');
    if (!card || e.target !== card) return;
    e.preventDefault();
    openBrand(card.getAttribute('data-brand-open'));
  });
  document.getElementById('backToBrands').addEventListener('click', backToBrands);
  document.getElementById('backFab').addEventListener('click', backToBrands);

  /* 왼쪽 위 로고를 누르면 홈(브랜드 폴더)으로 */
  document.getElementById('homeLogo').addEventListener('click', function (e) {
    e.preventDefault();
    var open = document.querySelector('.modal.open');
    if (open) { closeModal(modalNameOf(open.id)); return; }
    if (view === 'brand') { backToBrands(); return; }
    filter.itemType = 'all';
    filter.q = '';
    var si = document.getElementById('searchInput');
    if (si) si.value = '';
    resetPaging();
    renderAll();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  /* 왼쪽→오른쪽 스와이프로도 뒤로 (모달 → 브랜드 → 홈) */
  var swipeStart = null;
  document.addEventListener('touchstart', function (e) {
    if (e.touches.length !== 1) { swipeStart = null; return; }
    var t = e.touches[0];
    swipeStart = { x: t.clientX, y: t.clientY, el: e.target, time: Date.now() };
  }, { passive: true });
  document.addEventListener('touchend', function (e) {
    if (!swipeStart) return;
    var t = e.changedTouches[0];
    var dx = t.clientX - swipeStart.x;
    var dy = t.clientY - swipeStart.y;
    var start = swipeStart;
    swipeStart = null;
    if (Date.now() - start.time > 900) return;
    if (dx < 80 || Math.abs(dy) > 50) return;
    var el = start.el;
    if (el && el.closest && el.closest('.type-bar, .cat-bar, .chips, .sizes, .swatches, .stepper, input, textarea, .picks')) return;
    if (!document.querySelector('.modal.open') && view !== 'brand') return;
    backToBrands();
  }, { passive: true });
  document.getElementById('cartFab').addEventListener('click', function () {
    renderCart();
    openModal('cart');
  });

  /* ── 시작 ─────────────────────────────────────────────── */
  load();
  try { history.replaceState({ ui: 'home' }, ''); } catch (e) {}
  renderCategories();
  renderAll();
  renderCart();
  renderBadge();
  if (cart.length && delivery === 'combined') {
    // 저장된 선택 유지
  }

  // 테스트/디버그용 (사이트 동작에는 영향 없음)
  window.__HYEONMARKET__ = {
    getCart: function () { return cart.slice(); },
    getDelivery: function () { return delivery; },
    subtotal: subtotal,
    shippingFee: shippingFee,
    total: grandTotal,
    buildOrderText: buildOrderText,
    addToCart: addToCart,
    openDetail: openDetail,
    openSizeChart: openSizeChart,
    openBrand: openBrand,
    backToBrands: backToBrands,
    getView: function () { return { view: view, brandId: brandViewId, category: filter.category, itemType: filter.itemType, q: filter.q, sort: sortMode, initial: initialFilter }; },
    getDetail: function () {
      if (!detailState) return null;
      return { productId: detailState.productId, color: detailState.color, size: detailState.size, picks: detailState.picks.slice() };
    },
    getUIState: function () { return currentUIState(); },
    historyState: function () { return history.state; },
    goBack: function () { backToBrands(); },
    isJunior: isJunior,
    openCart: function () { renderCart(); openModal('cart'); }
  };
})();
</script>
</body>
</html>
